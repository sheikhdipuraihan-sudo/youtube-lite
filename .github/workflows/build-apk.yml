name: Build patched YouTube Lite APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: sdkmanager "platform-tools" "build-tools;35.0.0"
      - name: Install Apktool
        run: |
          curl -L --fail -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          printf '#!/bin/sh\nexec java -jar /tmp/apktool.jar "$@"\n' > /tmp/apktool
          chmod +x /tmp/apktool
      - name: Decode supplied APK
        run: /tmp/apktool d --force --output build/decoded input/YouTubeLite-original.apk
      - name: Apply player and branding patches
        run: python3 tools/apply_apk_patches.py
      - name: Rebuild patched APK
        run: /tmp/apktool b build/decoded --output build/youtube-lite-unsigned.apk
      - name: Align and sign release APK with temporary key
        run: |
          zipalign -f -p 4 build/youtube-lite-unsigned.apk build/youtube-lite-release-aligned.apk
          keytool -genkeypair -v -keystore build/temporary-release.keystore \
            -storepass temporary-release -alias youtube-lite-release \
            -keypass temporary-release -keyalg RSA -keysize 4096 -validity 30 \
            -dname "CN=YouTube Lite Temporary Release,O=YouTube Lite,C=US"
          apksigner sign --ks build/temporary-release.keystore \
            --ks-pass pass:temporary-release --key-pass pass:temporary-release \
            --out build/youtube-lite-release.apk build/youtube-lite-release-aligned.apk
          apksigner verify --verbose build/youtube-lite-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: youtube-lite-release
          path: build/youtube-lite-release.apk
